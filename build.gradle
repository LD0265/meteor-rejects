plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenLocal()
    mavenCentral()

    maven { url "https://maven.meteordev.org/releases" }
    maven { url "https://maven.meteordev.org/snapshots" }

    maven { url "https://maven.seedfinding.com/" }
    maven { url "https://maven-snapshots.seedfinding.com/" }

    maven { url 'https://jitpack.io' }

    // Repository containing the Cubiomes Java bindings.
    maven { url 'https://maven.duti.dev/releases' }
}

loom {
    accessWidenerPath = file("src/main/resources/meteor-rejects.accesswidener")
}

configurations {
    // Libraries that need to be bundled into the final mod JAR.
    extraLibs
}

dependencies {
    // -----------------------------------------------------------------
    // Cubiomes
    //
    // Include the Java API plus native implementations for all supported
    // desktop platforms. The Cubiomes loader selects the appropriate
    // native library at runtime.
    // -----------------------------------------------------------------

    extraLibs('dev.duti.acheong:cubiomes:1.22.3') {
        transitive = false
    }

    extraLibs('dev.duti.acheong:cubiomes:1.22.3:linux64') {
        transitive = false
    }

    extraLibs('dev.duti.acheong:cubiomes:1.22.3:osx') {
        transitive = false
    }

    extraLibs('dev.duti.acheong:cubiomes:1.22.3:windows64') {
        transitive = false
    }

    // Minecraft / Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation("meteordevelopment:meteor-client:${project.minecraft_version}-SNAPSHOT")

    compileOnly "meteordevelopment:baritone:${project.baritone_version}-SNAPSHOT"

    // -----------------------------------------------------------------
    // Seed finding / Ore simulation
    // -----------------------------------------------------------------

    extraLibs('com.seedfinding:mc_math:ffd2edcfcc0d18147549c88cc7d8ec6cf21b5b91') {
        transitive = false
    }

    extraLibs('com.seedfinding:mc_seed:1ead6fcefe7e8de4b3d60cd6c4e993f1e8f33409') {
        transitive = false
    }

    extraLibs('com.seedfinding:mc_core:1.210.0') {
        transitive = false
    }

    extraLibs('com.seedfinding:mc_noise:7e3ba65e181796c4a2a1c8881d840b2254b92962') {
        transitive = false
    }

    extraLibs('com.seedfinding:mc_biome:41a42cb9019a552598f12089059538853e18ec78') {
        transitive = false
    }

    extraLibs('com.seedfinding:mc_terrain:b4246cbd5880c4f8745ccb90e1b102bde3448126') {
        transitive = false
    }

    extraLibs('com.seedfinding:mc_feature:919b7e513cc1e87e029a9cd703fc4e2dc8686229') {
        transitive = false
    }

    // Seedcracker API
    implementation(include(
        'com.github.19MisterX98.SeedcrackerX:seedcrackerx-api:2.10.1'
    )) {
        transitive = false
    }

    // Exploit Preventer (optional)
    compileOnly("com.nikoverflow:exploit-preventer-api:0.0.1")

    // Make extraLibs available during compilation as well.
    configurations.implementation.extendsFrom(configurations.extraLibs)
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "mc_version": project.minecraft_version,
            "gh_hash": (System.getenv("GITHUB_SHA") ?: "")
        )
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName}" }
    }

    // Unpack all bundled dependencies into the final JAR.
    from {
        configurations.extraLibs.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"

    def targetVersion = 25

    if (JavaVersion.current().isJava9Compatible()) {
        it.options.release = targetVersion
    }
}